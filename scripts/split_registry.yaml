# =============================================================================
# Split Registry — central configuration for all dataset experiment splits.
#
# Used by: scripts/03_make_splits.py
#
# Structure:
#   defaults:          shared parameters (can be overridden per-experiment)
#   datasets:
#     <dataset_key>:
#       input_jsonl:   path to all.jsonl from VQA generation
#       image_root:    root directory for resolving image relative paths
#       experiments:   list of split configurations to generate
#         - name:      unique split name (output dir = experiments/splits/<name>/)
#           mode:      random_k | superclass_balanced_k
#           k:         number of forget classes
#           (any field from defaults can be overridden here)
# =============================================================================

defaults:
  n_train_per_forget_class: 100
  n_test_per_forget_class: 100
  n_retain_train: 2000
  n_retain_test: 500
  seed: 42

datasets:
  # ── ImageNet (1000 classes, ~1300 images/class) ──────────────────────
  imagenet:
    input_jsonl: vqa_gen/output/output_imagenet/all.jsonl
    image_root: data/imagenet-1k
    experiments:
      - name: imagenet_rk10_s42
        mode: random_k
        k: 10
      - name: imagenet_rk50_s42
        mode: random_k
        k: 50
      - name: imagenet_sbk10_s42
        mode: superclass_balanced_k
        k: 10

  # ── COCO (80 categories, variable images/class) ─────────────────────
  coco:
    input_jsonl: vqa_gen/output/output_coco/all.jsonl
    image_root: data/coco
    experiments:
      - name: coco_rk10_s42
        mode: random_k
        k: 10
      - name: coco_sbk10_s42
        mode: superclass_balanced_k
        k: 10

  # ── AID (30 aerial scene classes, ~200-400 images/class) ─────────────
  aid:
    input_jsonl: vqa_gen/output/output_aid/all.jsonl
    image_root: data/AID
    experiments:
      - name: aid_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 50
        n_test_per_forget_class: 50
        n_retain_train: 1000
        n_retain_test: 300

  # ── MIT Indoor-67 (67 scene classes, ~80-130 images/class) ───────────
  mit_indoor67:
    input_jsonl: vqa_gen/output/output_mit_indoor67/all.jsonl
    image_root: data/mit_indoor67
    experiments:
      - name: mit_indoor67_rk10_s42
        mode: random_k
        k: 10
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 1000
        n_retain_test: 300

  # ── Celebrity Faces (17 people, 100-200 images/person) ──────────────
  celebrity_faces:
    input_jsonl: vqa_gen/output/output_celebrity_faces/all.jsonl
    image_root: "data/celebrity_faces/Celebrity Faces Dataset"
    experiments:
      - name: celebrity_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 500
        n_retain_test: 200

  # ── Logo-2K+ (2341 logo classes, variable images/class) ─────────────
  logo2kplus:
    input_jsonl: vqa_gen/output/output_logo2kplus/all.jsonl
    image_root: "data/LOGO-2K+/Logo-2K+"
    experiments:
      - name: logo2kplus_rk10_s42
        mode: random_k
        k: 10
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 1000
        n_retain_test: 300

  # ── LAD Attribute variants ──────────────────────────────────────────
  lad_color:
    input_jsonl: vqa_gen/output/output_lad_color/all.jsonl
    image_root: data/LAD
    experiments:
      - name: lad_color_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 500
        n_retain_test: 200

  lad_shape:
    input_jsonl: vqa_gen/output/output_lad_shape/all.jsonl
    image_root: data/LAD
    experiments:
      - name: lad_shape_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 500
        n_retain_test: 200

  lad_size:
    input_jsonl: vqa_gen/output/output_lad_size/all.jsonl
    image_root: data/LAD
    experiments:
      - name: lad_size_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 500
        n_retain_test: 200

  lad_habitat:
    input_jsonl: vqa_gen/output/output_lad_habitat/all.jsonl
    image_root: data/LAD
    experiments:
      - name: lad_habitat_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 500
        n_retain_test: 200

  lad_behaviour:
    input_jsonl: vqa_gen/output/output_lad_behaviour/all.jsonl
    image_root: data/LAD
    experiments:
      - name: lad_behaviour_rk5_s42
        mode: random_k
        k: 5
        n_train_per_forget_class: 30
        n_test_per_forget_class: 30
        n_retain_train: 500
        n_retain_test: 200

  # ── SpatialMQA (spatial reasoning, uses COCO images) ────────────────
  spatialmqa:
    input_jsonl: vqa_gen/output/output_spatialmqa/all.jsonl
    image_root: data/coco
