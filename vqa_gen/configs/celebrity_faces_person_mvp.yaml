dataset:
  source_type: "celebrity_faces"
  root: "data/celebrity_faces/Celebrity Faces Dataset"

paths:
  output_root: "vqa_gen/output/output_celebrity_faces"
  category_metadata: "vqa_gen/ontology/celebrity_faces.json"

vqa_task:
  question: "Who is the person shown in the image?"
  concept_axis: "person"
  forgetting_level: "privacy"

splits:
  ratios: {forget: 0.1, retain: 0.8, test: 0.1}
  seed: 123

choices:
  hard_negatives: 2
  easy_negatives: 1

export:
  write_val: false
