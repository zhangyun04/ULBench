dataset:
  source_type: "spatialmqa"
  hf_repo: "liuziyan/SpatialMQA"
  image_root: "data/coco"
  splits: ["train", "validation", "test"]

paths:
  output_root: "vqa_gen/output_spatialmqa"

splits:
  ratios: {forget: 0.1, retain: 0.8, test: 0.1}
  seed: 123

# Not used for prebuilt VQA; kept for pipeline compatibility.
choices:
  hard_negatives: 2
  easy_negatives: 1

export:
  write_val: false
