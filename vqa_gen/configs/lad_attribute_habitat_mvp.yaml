dataset:
  source_type: "lad"
  root: "data/LAD"
  attribute_group: "habitat"
  # concept_axis auto-derived as "attribute_habitat"
  threshold: 0.3

paths:
  output_root: "vqa_gen/output/output_lad_habitat"

splits:
  ratios: {forget: 0.1, retain: 0.8, test: 0.1}
  seed: 123

# Not used for prebuilt VQA; kept for pipeline compatibility.
choices:
  hard_negatives: 2
  easy_negatives: 1

export:
  write_val: false
